[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "joinforecast"
version = "0.2.2"
description = "Offline, exact CSV equality-join row-count preflight"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
joinforecast = "joinforecast.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["joinforecast"]
branch = true

[tool.coverage.report]
show_missing = true
